<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator - Resume Autofill Pro</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        .icons {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .icon-container {
            text-align: center;
        }
        canvas {
            border: 1px solid #ddd;
            background: white;
        }
        button {
            margin-top: 10px;
            padding: 8px 16px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #2563eb; }
        .instructions {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>⚡ Icon Generator</h1>
    <p>Click "Download" under each icon to save it.</p>
    
    <div class="icons">
        <div class="icon-container">
            <canvas id="icon16" width="16" height="16"></canvas>
            <br><small>16x16</small>
            <br><button onclick="download('icon16')">Download</button>
        </div>
        <div class="icon-container">
            <canvas id="icon48" width="48" height="48"></canvas>
            <br><small>48x48</small>
            <br><button onclick="download('icon48')">Download</button>
        </div>
        <div class="icon-container">
            <canvas id="icon128" width="128" height="128"></canvas>
            <br><small>128x128</small>
            <br><button onclick="download('icon128')">Download</button>
        </div>
    </div>
    
    <button onclick="downloadAll()">Download All Icons</button>
    
    <div class="instructions">
        <h3>Instructions</h3>
        <ol>
            <li>Click "Download All Icons" above</li>
            <li>Save the files as: <code>icon16.png</code>, <code>icon48.png</code>, <code>icon128.png</code></li>
            <li>Place them in the <code>extension/icons/</code> folder</li>
            <li>Reload the extension in Chrome</li>
        </ol>
    </div>
    
    <script>
        function drawIcon(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            
            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#3b82f6');
            gradient.addColorStop(1, '#8b5cf6');
            
            // Draw rounded rectangle
            const radius = size * 0.2;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // Draw lightning bolt
            ctx.fillStyle = 'white';
            ctx.beginPath();
            
            const cx = size / 2;
            const cy = size / 2;
            const scale = size / 128;
            
            // Lightning bolt path
            ctx.moveTo(cx + 10 * scale, cy - 40 * scale);
            ctx.lineTo(cx - 20 * scale, cy + 5 * scale);
            ctx.lineTo(cx - 5 * scale, cy + 5 * scale);
            ctx.lineTo(cx - 15 * scale, cy + 40 * scale);
            ctx.lineTo(cx + 20 * scale, cy - 5 * scale);
            ctx.lineTo(cx + 5 * scale, cy - 5 * scale);
            ctx.closePath();
            ctx.fill();
        }
        
        function download(canvasId) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = canvasId + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        function downloadAll() {
            download('icon16');
            setTimeout(() => download('icon48'), 100);
            setTimeout(() => download('icon128'), 200);
        }
        
        // Draw all icons on load
        drawIcon('icon16');
        drawIcon('icon48');
        drawIcon('icon128');
    </script>
</body>
</html>
